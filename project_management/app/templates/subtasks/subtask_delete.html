{% extends "base.html" %}

{% block title %}Delete Task - Network Project Management{% endblock %}

{% block content %}
<div class="delete-confirmation">
    <div class="confirmation-card">
        <h2>Delete Task</h2>
        <p>Are you sure you want to delete the task "<strong>{{ task.name }}</strong>"?</p>
        <p style="color: #d32f2f; font-size: 14px;">This action cannot be undone.</p>

        <div class="confirmation-actions">
            <form method="post" style="display: inline;">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete Task</button>
            </form>
            <a href="{% url 'milestone_detail' task.milestone.id %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
